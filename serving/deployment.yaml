apiVersion: apps/v1
kind: Deployment
metadata:
  name: transit-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transit-api
  template:
    metadata:
      labels:
        app: transit-api
    spec:
      containers:
        - name: transit-api
          image: transit-api:local
          imagePullPolicy: Never


          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          